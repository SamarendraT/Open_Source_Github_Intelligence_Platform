resources:
  jobs:
    gh_intel_pipeline:
      name: gh-intel-medallion-pipeline
      tags:
        project: gh-intel
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../../notebooks/bronze_build.ipynb
          max_retries: 2
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../../notebooks/silver_build.ipynb
          max_retries: 2
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../notebooks/gold_build.ipynb
          max_retries: 2
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - tsamarendra@outlook.com
      queue:
        enabled: true